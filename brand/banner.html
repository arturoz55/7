<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
  html,body{margin:0;background:#0B0B0C}
  .b{position:relative;width:1500px;height:500px;overflow:hidden;background:
     radial-gradient(700px 420px at 78% 50%, rgba(124,104,255,.38), transparent 70%),
     radial-gradient(500px 300px at 10% 0%, rgba(40,214,170,.10), transparent 70%), #0B0B0C;
     font-family:Inter,system-ui,sans-serif;color:#fff}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:50px 50px;
     -webkit-mask-image:radial-gradient(800px 400px at 70% 50%,#000,transparent 75%)}
  .mark{position:absolute;right:120px;top:50%;width:400px;transform:translateY(-50%) rotate(-8deg);filter:drop-shadow(0 30px 60px rgba(82,54,232,.6))}
  .ghost{position:absolute;right:-140px;top:-120px;width:560px;opacity:.06;transform:rotate(20deg)}
  .txt{position:absolute;left:96px;top:96px;width:780px}
  .brand{display:flex;align-items:center;gap:16px;font:600 30px "Inter Tight",sans-serif;letter-spacing:-.02em}
  .brand img{width:52px;height:52px}
  h1{margin:30px 0 0;font:500 64px/1.02 "Inter Tight",sans-serif;letter-spacing:-.04em}
  h1 span{background:linear-gradient(90deg,#B3A8FF,#7C68FF 60%,#28D6AA);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pills{display:flex;gap:10px;margin-top:28px}
  .pills div{padding:9px 16px;border:1px solid rgba(255,255,255,.14);border-radius:99px;font-size:17px;color:rgba(255,255,255,.78);background:rgba(255,255,255,.03)}
</style></head><body>
<div class="b" id="banner"><div class="grid"></div>
  <img class="ghost" src="mark-white.png" alt="">
  <img class="mark" src="mark-white.png" alt="">
  <div class="txt">
    <div class="brand"><img src="../icon.svg" alt="">Spout</div>
    <h1>Token fees that pay<br><span>real websites.</span></h1>
    <div class="pills"><div>Launch a token</div><div>Name a website</div><div>It gets paid</div></div>
  </div>
</div>
<div id="avatar" style="width:400px;height:400px;margin-top:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8B7BFF,#5236E8)">
  <img src="mark-white.png" style="width:250px" alt="">
</div>
</body></html>
